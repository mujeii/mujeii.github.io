<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meili Bai — Silent Engine</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #11100e;
            color: #e8e0d2;
            font-family: Georgia, "Times New Roman", serif;
            overflow: hidden;
        }

        .page {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at center,
                    rgba(95, 72, 48, 0.20),
                    transparent 55%
                ),
                #11100e;
        }

        /* Desert dust */
        .page::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(190,160,110,.08), transparent 2%),
                radial-gradient(circle at 70% 65%, rgba(190,160,110,.06), transparent 2%),
                radial-gradient(circle at 45% 80%, rgba(190,160,110,.05), transparent 2%);
            pointer-events: none;
        }

        /* Film grain */
        .grain {
            position: absolute;
            inset: 0;
            opacity: 0.08;
            pointer-events: none;
            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 30px;
            animation: fadeIn 2s ease;
        }

        .small {
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 105px);
            font-weight: normal;
            letter-spacing: 8px;
            line-height: 1;
            text-transform: uppercase;
        }

        .chinese {
            margin-top: 14px;
            font-size: 20px;
            letter-spacing: 8px;
            opacity: 0.75;
        }

        .line {
            width: 120px;
            height: 1px;
            background: #81715c;
            margin: 38px auto;
            opacity: 0.6;
        }

        .quote {
            max-width: 500px;
            margin: auto;
            font-size: 17px;
            line-height: 1.9;
            font-style: italic;
            color: #cfc3b2;
        }

        .enter {
            display: inline-block;
            margin-top: 45px;
            padding: 13px 32px;
            border: 1px solid rgba(232,224,210,.35);
            color: #e8e0d2;
            text-decoration: none;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 4px;
            transition: all .4s ease;
        }

        .enter:hover {
            background: #e8e0d2;
            color: #11100e;
            border-color: #e8e0d2;
        }

        .location {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: "Courier New", monospace;
            font-size: 10px;
            letter-spacing: 3px;
            opacity: 0.4;
            z-index: 2;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                letter-spacing: 4px;
            }

            .quote {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="grain"></div>

        <div class="content">

            <div class="small">
                CHARACTER STORY / OOC
            </div>

            <h1>Meili Bai</h1>

            <div class="chinese">
                白梅丽
            </div>

            <div class="line"></div>

            <p class="quote">
                She doesn't need saving.<br>
                She just doesn't always know how to save herself.        
            </p>

            <a href="#" class="enter">
                ENTER
            </a>

        </div>

        <div class="location">
            LOS SANTOS, CA &nbsp; / &nbsp; 2026
        </div>

    </main>

</body>
</html>
